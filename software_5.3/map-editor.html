<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图热点编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e; color: #e0e0e0;
  font-family: -apple-system, 'Microsoft YaHei', sans-serif;
  overflow: hidden; height: 100vh; user-select: none;
}
.app { display: flex; height: 100vh; }

/* ===== 左侧面板 ===== */
.sidebar {
  width: 300px; background: #16213e; padding: 16px;
  overflow-y: auto; border-right: 1px solid #0f3460; flex-shrink: 0;
}
.sidebar h1 { font-size: 17px; color: #e94560; margin-bottom: 4px; }
.hint { font-size: 12px; color: #7a7a9a; margin-bottom: 14px; line-height: 1.5; }
.spot-list { margin-bottom: 14px; }
.spot-item {
  padding: 8px 10px; margin-bottom: 3px; border-radius: 6px;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 13px; transition: background 0.12s; border: 1px solid transparent;
}
.spot-item:hover { background: #1a1a3e; }
.spot-item.active { background: #e94560; color: #fff; border-color: #ff6b81; }
.spot-check { font-size: 14px; width: 16px; text-align: center; color: #555; }
.spot-item.done .spot-check { color: #2ecc71; }
.spot-item.active .spot-check { color: #fff; }
.actions { display: flex; gap: 8px; margin-top: 8px; }
.actions button {
  flex: 1; padding: 9px; border: none; border-radius: 6px;
  cursor: pointer; font-size: 12px; background: #0f3460; color: #e0e0e0;
}
.actions button:hover { background: #1a5276; }
.actions button.danger { background: #4a2832; }
.actions button.danger:hover { background: #6a3848; }

/* ===== 地图区域 ===== */
.map-area {
  flex: 1; overflow: auto; display: flex;
  align-items: flex-start; justify-content: center; padding: 16px;
  background: #111;
}
.map-container { position: relative; display: inline-block; line-height: 0; }
#mapImg {
  display: block; max-width: 100%; max-height: calc(100vh - 32px);
  width: auto; height: auto; pointer-events: none;
}
.box {
  position: absolute; border: 2px solid; cursor: pointer; line-height: 1.4;
}
.box-label {
  position: absolute; top: 2px; left: 4px; font-size: 11px; color: #fff;
  background: rgba(0,0,0,0.65); padding: 1px 5px; border-radius: 3px; white-space: nowrap;
}
.box-info {
  position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: rgba(255,255,255,0.7);
}
.box-delete {
  position: absolute; top: -9px; right: -9px; width: 20px; height: 20px;
  background: #e74c3c; color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: pointer; border: 2px solid #1a1a2e; line-height: 1;
}
.temp-box {
  position: absolute; border: 2px dashed #e94560; background: rgba(233,69,96,0.08);
  pointer-events: none;
}

/* ===== 状态栏 ===== */
.status-bar {
  position: fixed; bottom: 0; left: 300px; right: 0; background: #16213e;
  padding: 6px 16px; font-size: 12px; color: #7a7a9a;
  border-top: 1px solid #0f3460; display: flex; justify-content: space-between;
}

/* ===== 导出弹窗 ===== */
.modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75); display: none;
  align-items: center; justify-content: center; z-index: 1000;
}
.modal.show { display: flex; }
.modal-content {
  background: #16213e; padding: 20px; border-radius: 10px;
  width: 640px; max-width: 90vw; border: 1px solid #0f3460;
}
.modal-content h2 { margin-bottom: 8px; color: #e94560; font-size: 16px; }
.modal-content p { font-size: 12px; color: #7a7a9a; margin-bottom: 10px; }
#exportText {
  width: 100%; height: 340px; background: #0d1b2a; color: #2ecc71;
  border: 1px solid #0f3460; border-radius: 6px; padding: 10px;
  font-family: Consolas, monospace; font-size: 12px; resize: vertical;
}
.modal-btns { margin-top: 10px; display: flex; gap: 8px; }
.modal-btns button {
  padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer;
  background: #0f3460; color: #e0e0e0; font-size: 13px;
}
.modal-btns button:hover { background: #1a5276; }
.modal-btns button.primary { background: #e94560; }
.modal-btns button.primary:hover { background: #ff5570; }
</style>
</head>
<body>
<div class="app">
  <!-- 左侧景点列表 -->
  <div class="sidebar">
    <h1>🗺️ 地图热点编辑器</h1>
    <p class="hint">① 点击左侧景点名选中<br>② 在地图上拖拽画框覆盖该景点<br>③ 全部画完后点「导出」复制数据</p>
    <div class="spot-list" id="spotList"></div>
    <div class="actions">
      <button onclick="exportData()">📋 导出 JSON</button>
      <button class="danger" onclick="clearAll()">🗑 清空</button>
    </div>
  </div>

<!-- 状态栏 -->
<div class="status-bar">
  <span id="status">未选择景点</span>
  <span id="progress">已标注 0/22</span>
</div>

<!-- 导出弹窗 -->
<div class="modal" id="exportModal">
  <div class="modal-content">
    <h2>导出数据</h2>
    <p>复制以下 JSON，发给我即可。已标注的景点包含 x/y/w/h 百分比坐标，未标注的为 null。</p>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-btns">
      <button class="primary" onclick="copyExport()">📋 复制到剪贴板</button>
      <button onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const spots = [['buddha','灵山大佛'],['palm','灵山佛手'],['ayuwang','阿育王柱'],['wujinyi','无尽意斋'],['xingtan','杏坛广场'],['xiangfu','祥符禅寺'],['fangsheng','放生礼佛'],['jiulong','九龙灌浴'],['baizi','百子戏弥勒'],['sushi','蔬食馆'],['futan','梵足坛'],['wuyin','五印坛城'],['qifu','祈福普缘'],['fangong','灵山梵宫'],['manfeilong','曼飞龙塔'],['jingshe','灵山精舍'],['talong','灵山多宝塔'],['shengshi','盛凡斋'],['holiday-plaza','假日广场'],['ticket-gate','检票口'],['tourist-center','游客中心'],['guide-service','导游服务']];
let currentSpot = null;
let boxes = {};
let isDrawing = false, startX = 0, startY = 0, tempBox = null;
const mapContainer = document.getElementById('mapContainer');

const COLORS = ['#e94560','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e74c3c','#3a86ff','#fb5607'];
function colorFor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

function initList() {
  document.getElementById('spotList').innerHTML = spots.map(([id, name]) =>
    `<div class="spot-item" data-id="${id}" onclick="selectSpot('${id}','${name}')">
      <span class="spot-check" id="chk-${id}">○</span><span>${name}</span>
    </div>`
  ).join('');
}

function selectSpot(id, name) {
  currentSpot = { id, name };
  document.querySelectorAll('.spot-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id)
  );
  updateStatus();
}

function updateStatus() {
  const done = Object.keys(boxes).length;
  document.getElementById('status').textContent = currentSpot ? '当前: ' + currentSpot.name : '未选择景点';
  document.getElementById('progress').textContent = `已标注 ${done}/${spots.length}`;
}

function updateList() {
  spots.forEach(([id]) => {
    const chk = document.getElementById('chk-' + id);
    const item = document.querySelector(`.spot-item[data-id="${id}"]`);
    if (boxes[id]) { chk.textContent = '✓'; item.classList.add('done'); }
    else { chk.textContent = '○'; item.classList.remove('done'); }
  });
}

// ===== 画框 =====
mapContainer.addEventListener('mousedown', e => {
  if (!currentSpot) { alert('请先在左侧选择一个景点'); return; }
  if (e.target.classList.contains('box-delete')) return;
  const r = mapContainer.getBoundingClientRect();
  startX = e.clientX - r.left; startY = e.clientY - r.top;
  isDrawing = true;
  tempBox = document.createElement('div');
  tempBox.className = 'temp-box';
  mapContainer.appendChild(tempBox);
  e.preventDefault();
});

mapContainer.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const r = mapContainer.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const l = Math.min(startX, cx), t = Math.min(startY, cy);
  const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
  Object.assign(tempBox.style, { left: l+'px', top: t+'px', width: w+'px', height: h+'px' });
});

document.addEventListener('mouseup', e => {
  if (!isDrawing) return;
  isDrawing = false;
  const r = mapContainer.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const l = Math.min(startX, cx), t = Math.min(startY, cy);
  const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
  if (tempBox) { tempBox.remove(); tempBox = null; }
  if (w < 5 || h < 5) return;
  boxes[currentSpot.id] = {
    x: +(l / r.width * 100).toFixed(1),
    y: +(t / r.height * 100).toFixed(1),
    w: +(w / r.width * 100).toFixed(1),
    h: +(h / r.height * 100).toFixed(1),
    name: currentSpot.name
  };
  renderBoxes(); updateList(); updateStatus();
});

function renderBoxes() {
  mapContainer.querySelectorAll('.box').forEach(el => el.remove());
  Object.entries(boxes).forEach(([id, b]) => {
    const c = colorFor(id);
    const el = document.createElement('div');
    el.className = 'box';
    el.style.cssText = `left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;border-color:${c};background:${c}1a`;
    el.innerHTML = `<span class="box-label">${b.name}</span><span class="box-info">${b.w}×${b.h}</span><span class="box-delete" onclick="deleteBox('${id}',event)">×</span>`;
    mapContainer.appendChild(el);
  });
}

function deleteBox(id, e) { e.stopPropagation(); delete boxes[id]; renderBoxes(); updateList(); updateStatus(); }

function clearAll() {
  if (confirm('确定清空所有标注？')) { boxes = {}; renderBoxes(); updateList(); updateStatus(); }
}

function exportData() {
  const data = spots.map(([id, name]) => {
    const b = boxes[id];
    return b ? { id, name, x: b.x, y: b.y, w: b.w, h: b.h }
             : { id, name, x: null, y: null, w: null, h: null };
  });
  document.getElementById('exportText').value = JSON.stringify(data, null, 2);
  document.getElementById('exportModal').classList.add('show');
}

function copyExport() {
  const t = document.getElementById('exportText');
  t.select(); document.execCommand('copy');
  alert('已复制！粘贴发给我即可。');
}

function closeModal() { document.getElementById('exportModal').classList.remove('show'); }

initList(); updateStatus();
</script>
</body>
